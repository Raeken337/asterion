<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asterion</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./vendor/marked.umd.js" defer></script>
  <script src="./vendor/purify.min.js" defer></script>
  <script src="./markdown.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="identity">
        <span class="moon" aria-hidden="true">☾</span>
        <div>
          <h1>Asterion</h1>
          <p>A little clarity in the cosmos.</p>
        </div>
      </div>
      <span class="badge">Local AI · Qwen3 8B · Thinking off</span>
    </header>

    <div class="workspace">
    <aside class="chat-sidebar" aria-label="Saved conversations">
      <button id="new-chat" class="secondary-button" type="button">＋ New chat</button>
      <p class="sidebar-label">Saved conversations</p>
      <nav id="chat-list" aria-label="Choose a conversation"></nav>
      <button id="reload-chats" class="secondary-button" type="button">Reload chats</button>
      <p id="chat-status" role="status">Loading saved chats…</p>
    </aside>
    <div class="chat-panel">
    <div class="chat-heading">
      <h2 id="chat-title">New chat</h2>
      <div class="chat-actions">
        <button id="rename-chat" class="secondary-button" type="button">Rename</button>
        <button id="delete-chat" class="secondary-button" type="button">Delete</button>
      </div>
    </div>
    <section class="toolbar" aria-label="Chat settings">
      <div class="personality-control">
        <label for="personality">Personality</label>
        <select id="personality">
          <option value="playful">Playful</option>
          <option value="brooding">Brooding</option>
          <option value="clinical">Clinical</option>
          <option value="boomer">Boomer</option>
          <option value="celestial">Celestial</option>
        </select>
      </div>

      <button id="clear-chat" class="secondary-button" type="button">
        Clear chat
      </button>
    </section>

    <section
      id="messages"
      class="messages"
      role="log"
      aria-label="Conversation"
      aria-live="polite"
      aria-relevant="additions"
    ></section>

    <form id="chat-form" class="composer">
      <label class="visually-hidden" for="message-input">
        Your message
      </label>
      <textarea
        id="message-input"
        name="message"
        rows="2"
        maxlength="4000"
        placeholder="What’s on your mind?"
        aria-describedby="composer-help"
        required
      ></textarea>
      <button class="send-button" type="submit">Send ↑</button>
    </form>

    <footer id="composer-help">
      Enter to send · Shift + Enter for a new line ·
      Chats saved on this computer · Only recent messages reach the model
    </footer>
    </div>
    </div>
  </main>
  <dialog id="chat-dialog" aria-labelledby="dialog-title">
    <form method="dialog">
      <h2 id="dialog-title">Chat action</h2>
      <p id="dialog-description"></p>
      <label id="dialog-label" for="dialog-input">Conversation name</label>
      <input id="dialog-input" type="text" maxlength="100" autocomplete="off">
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel" formnovalidate>Cancel</button>
        <button id="dialog-confirm" class="send-button" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
